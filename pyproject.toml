[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cropwater-rs"
version = "1.0.0"
description = "Remote Sensing-based Crop Water Requirement and Phenology Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "Alexey Valero-Jorge"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "sentinelhub>=3.11",
  "pyproj>=3.6",
  "pyogrio>=0.9"
]

[project.urls]
Homepage = "https://github.com/avalero92/CropWater-RS"
Repository = "https://github.com/avalero92/CropWater-RS"
